<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Pessoas Fictícias</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-field: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { max-width: 1000px; width: 100%; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--primary); }
        .version { font-size: 12px; color: var(--text-muted); }

        .actions-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { background-color: var(--primary-hover); }
        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        button.secondary:hover { background-color: var(--bg-card); }

        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        .profile-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .avatar-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-body);
            background-color: var(--bg-field);
            display: block;
            transition: opacity 0.3s;
        }

        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-field);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-muted);
            border: 4px solid var(--bg-body);
            z-index: 2;
        }

        .loading.hidden { display: none; }

        .profile-card h2 { font-size: 18px; margin-bottom: 5px; word-break: break-word; }
        .profile-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; }

        .tag {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .data-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .field {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
            position: relative;
            transition: border-color 0.2s;
        }
        .field:hover { border-color: var(--primary); }

        .field label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .field span {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            word-break: break-all;
            display: block;
        }
        .field button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px 8px;
            font-size: 11px;
            background: var(--bg-body);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
        }
        .field button:hover { color: var(--primary); border-color: var(--primary); }

        .credit-card {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            font-family: monospace;
            color: white;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }
        .card-chip {
            width: 40px;
            height: 30px;
            background: #fbbf24;
            border-radius: 4px;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        .card-number { font-size: 20px; letter-spacing: 2px; margin-bottom: 20px; }
        .card-details { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.9; }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .data-section { grid-template-columns: 1fr; }
        }
    </style>
</head>

    // ==========================================
    // FUNÇÕES AUXILIARES
    // ==========================================
    const random = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    // ==========================================
    // GERADORES DE DADOS
    // ==========================================
    function gerarNome() {
        return `${random(nomes)} ${random(sobrenomes)} ${random(sobrenomes)}`;
    }

    function gerarCPF() {
        const n = () => Math.round(Math.random() * 9);
        let n1 = n(), n2 = n(), n3 = n(), n4 = n(), n5 = n(), n6 = n(), n7 = n(), n8 = n(), n9 = n();
        let d1 = n1*10 + n2*9 + n3*8 + n4*7 + n5*6 + n6*5 + n7*4 + n8*3 + n9*2;
        d1 = 11 - (d1 % 11);
        if (d1 >= 10) d1 = 0;
        let d2 = d1*2 + n1*11 + n2*10 + n3*9 + n4*8 + n5*7 + n6*6 + n7*5 + n8*4 + n9*3;
        d2 = 11 - (d2 % 11);
        if (d2 >= 10) d2 = 0;
        return `${n1}${n2}${n3}.${n4}${n5}${n6}.${n7}${n8}${n9}-${d1}${d2}`;
    }

    function gerarRG() {
        return `${randomInt(10,99)}.${randomInt(100,999)}.${randomInt(100,999)}-${randomInt(0,9)}`;
    }

    function gerarDataNascimento() {
        const dia = String(randomInt(1, 28)).padStart(2, '0');
        const mes = String(randomInt(1, 12)).padStart(2, '0');
        const ano = randomInt(1970, 2005);
        return `${dia}/${mes}/${ano}`;
    }

    function gerarCEP() {
        return `${randomInt(10000,99999)}-${randomInt(100,999)}`;
    }

    function gerarTelefone() {
        return `(${randomInt(11,99)}) 9${randomInt(1000,9999)}-${randomInt(1000,9999)}`;
    }

    function gerarEmail(nome) {
        const limpo = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '.');
        return `${limpo}@${random(dominios)}`;
    }

    function gerarCartaoCredito() {
        let num = "";
        for (let i = 0; i < 15; i++) num += randomInt(0, 9);
        let soma = 0;
        let alternar = false;
        for (let i = num.length - 1; i >= 0; i--) {
            let n = parseInt(num[i]);
            if (alternar) {
                n *= 2;
                if (n > 9) n -= 9;
            }
            soma += n;
            alternar = !alternar;
        }
        const digito = (10 - (soma % 10)) % 10;
        const numeroFinal = num + digito;
        return numeroFinal.match(/.{1,4}/g).join(' ');
    }

    // ==========================================
    // FOTO FICTÍCIA - SEMPRE FRONTAL
    // ==========================================
    // Estratégia:
    // 1. Tenta randomuser.me (sempre funciona, mas pode vir de perfil)
    // 2. Fallback: lista curada de fotos frontais (randomuser.me/api/portraits)
    // 
    // As fotos em /api/portraits/ são SEMPRE frontais e quadradas.
    function gerarFotoFicticia(genero, callback) {
        // Primeiro: tenta buscar uma foto via API da randomuser.me
        // Se falhar em 3 segundos, usa a lista local (sempre funciona)
        
        const url = `https://randomuser.me/api/?gender=${genero}&t=${Date.now()}`;
        
        const timeoutId = setTimeout(() => {
            // Timeout -> usa a lista local
            callback(obterFotoLocal(genero));
        }, 3000);
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                clearTimeout(timeoutId);
                const fotoUrl = data.results[0].picture.large;
                callback(fotoUrl);
            })
            .catch(() => {
                clearTimeout(timeoutId);
                callback(obterFotoLocal(genero));
            });
    }

    // Retorna uma foto da lista local (sempre frontal)
    function obterFotoLocal(genero) {
        const generoStr = genero === 'female' ? 'women' : 'men';
        // Filtra as fotos do gênero correto
        const fotosGenero = fotosFrontais.filter(f => f.includes(`/${generoStr}/`));
        return random(fotosGenero);
    }

    // ==========================================
    // RENDERIZAÇÃO
    // ==========================================
    function criarCampo(label, valor, id) {
        return `

                <label>${label}</label>
                <span id="val-${id}">${valor}</span>
                <button onclick="copiar('val-${id}')">Copiar</button>
            </div>
        `;
    }

    function gerarTudo() {
        // Sorteia o gênero primeiro (para a foto bater com o nome)
        const genero = Math.random() < 0.5 ? 'male' : 'female';
        
        const nome = gerarNome();
        const cpf = gerarCPF();
        const rg = gerarRG();
        const dataNasc = gerarDataNascimento();
        const cep = gerarCEP();
        const tel = gerarTelefone();
        const email = gerarEmail(nome);
        const cartao = gerarCartaoCredito();
        const validade = `${String(randomInt(1,12)).padStart(2,'0')}/${randomInt(26,30)}`;
        const cvv = randomInt(100, 999);
        const signo = random(signos);
        const idade = new Date().getFullYear() - parseInt(dataNasc.split('/')[2]);
        
        const endereco = `${random(ruas)}, ${randomInt(1, 2000)} - ${random(cidades)}`;
        const empresa = random(empresas);
        const cargo = random(cargos);
        const salario = `R$ ${randomInt(3000, 20000).toLocaleString('pt-BR')},00`;

        // Atualizar Perfil
        document.getElementById('nome-display').innerText = nome;
        document.getElementById('email-display').innerText = email;

        // Foto Fictícia
        const imgElement = document.getElementById('foto');
        const loading = document.getElementById('loading');
        
        loading.classList.remove('hidden');
        imgElement.style.opacity = '0.3';
        
        // Primeiro coloca uma foto local (instantâneo)
        const fotoLocal = obterFotoLocal(genero);
        imgElement.src = fotoLocal;
        imgElement.style.opacity = '1';
        loading.classList.add('hidden');
        
        // Depois tenta atualizar via API (em background)
        gerarFotoFicticia(genero, function(fotoUrl) {
            if (fotoUrl) {
                // Pré-carrega a nova foto antes de trocar
                const novaImg = new Image();
                novaImg.onload = function() {
                    imgElement.src = fotoUrl;
                };
                novaImg.src = fotoUrl;
            }
        });

        // Renderizar Campos
        const html = `
            <div class="credit-card">
                <div class="card-chip"></div>
                <div class="card-number">${cartao}</div>
                <div class="card-details">
                    <span>TITULAR: ${nome.toUpperCase()}</span>
                    <span>VALIDADE: ${validade}</span>
                    <span>CVV: ${cvv}</span>
                </div>
            </div>

            ${criarCampo("Nome Completo", nome, "nome")}
            ${criarCampo("CPF (Válido)", cpf, "cpf")}
            ${criarCampo("RG", rg, "rg")}
            ${criarCampo("Data de Nascimento", `${dataNasc} (${idade} anos)`, "data")}
            ${criarCampo("Signo", signo, "signo")}
            ${criarCampo("E-mail", email, "email")}
            ${criarCampo("Celular / WhatsApp", tel, "tel")}
            ${criarCampo("CEP", cep, "cep")}
            ${criarCampo("Endereço Completo", endereco, "endereco")}
            ${criarCampo("Empresa", empresa, "empresa")}
            ${criarCampo("Cargo", cargo, "cargo")}
            ${criarCampo("Renda Salarial", salario, "salario")}
        `;

        document.getElementById('resultado').innerHTML = html;
    }

    // ==========================================
    // UTILITÁRIOS
    // ==========================================
    function copiar(id) {
        const texto = document.getElementById(id).innerText;
        navigator.clipboard.writeText(texto).then(() => {
            const btn = document.querySelector(`button[onclick="copiar('${id}')"]`);
            const original = btn.innerText;
            btn.innerText = '✓';
            setTimeout(() => btn.innerText = original, 1000);
        });
    }

    function copiarTudo() {
        const campos = document.querySelectorAll('.field');
        let json = {};
        campos.forEach(campo => {
            const label = campo.querySelector('label').innerText;
            const valor = campo.querySelector('span').innerText;
            json[label] = valor;
        });
        const texto = JSON.stringify(json, null, 2);
        navigator.clipboard.writeText(texto).then(() => {
            alert('Todos os dados copiados em formato JSON!');
        });
    }

    // Inicializa
    gerarTudo();
</script>
